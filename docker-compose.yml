services:
  backend:
    build: ./backend
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in your .env file}
      FRONTEND_ORIGINS: http://localhost:8080
      DATABASE_URL: sqlite:////data/qa_system.db
    volumes:
      - qa_data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  qa_data:
